# ==============================================================================
# FinvisIQ Spring Boot Application Configuration
# ==============================================================================

# Server configuration (Dynamic port binding for Railway deployment)
server.port=${PORT:8080}
server.address=0.0.0.0

# Application info
spring.application.name=finvisiq-backend

# Production Database (Aiven MySQL 8.x - smart_finance_db)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-18243dae-akileshanand302006-3318.a.aivencloud.com:20218/smart_finance_db?sslMode=REQUIRED&sslContextProvider=FinvisIQSSLProvider}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FinvisIQHikariPool

# CORS configuration (Matches Netlify production and local development frontends)
finvisiq.cors.allowed-origins=${FRONTEND_URL:https://finvis.netlify.app}

# JWT Security
finvisiq.jwt.secret=${JWT_SECRET:finvisiq_production_secure_jwt_signing_key_secret_2026_32bytes}
finvisiq.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator / Health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JSON Serialization
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata
